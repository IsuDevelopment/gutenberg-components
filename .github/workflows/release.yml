name: release

# Publishes @isudev/gutenberg when a v* tag is pushed. Authentication is npm trusted
# publishing over OIDC — no NPM_TOKEN exists anywhere, and npm attaches a provenance
# attestation linking the tarball to this workflow run.
#
# npm's trusted publisher configuration names *this file*. Renaming it, or moving the publish
# step into a reusable workflow, breaks authentication: npm authorises the workflow that
# starts the run, not one it calls.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  # Lets the runner mint the OIDC token npm exchanges for publish rights. Without it the
  # publish fails with an authentication error rather than anything more suggestive.
  id-token: write

# A single tag push has been observed starting two runs a second apart. Two concurrent
# publishes of one version means one succeeds and the other fails confusingly, so serialize
# them — and never cancel a publish that is already in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, not the .nvmrc 22 the rest of the repo uses — the only job that diverges.
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 bundles npm 10.9.8 and Node 24
      # bundles 11.17.0, so picking the Node is the whole of the fix.
      #
      # The obvious alternative, `npm install -g npm@latest`, is what broke both runs of the
      # v0.1.1 tag: npm overwrites its own dependency tree while still running and dies with
      # `Cannot find module 'promise-retry'`. Installing it into a private prefix instead
      # works but took minutes locally, which is too slow to put in front of every release.
      #
      # Safe because this job runs the full gate — tests and verify:package — under the same
      # Node that builds the tarball it publishes. Nothing ships unverified by the toolchain
      # that produced it.
      #
      # Deliberately no `registry-url`: it writes an .npmrc expecting NODE_AUTH_TOKEN, which
      # is exactly what OIDC replaces.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A future Node 24 patch could regress the bundled npm below what OIDC needs. Better a
      # named failure here than an authentication error at the publish step.
      - name: npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          node -e '
            const [ major, minor, patch ] = process.argv[ 1 ].split( "." ).map( Number );
            const ok = major > 11 || ( major === 11 && ( minor > 5 || ( minor === 5 && patch >= 1 ) ) );
            if ( ! ok ) {
              console.error( `::error::npm ${ process.argv[ 1 ] } predates trusted publishing, which needs 11.5.1 or newer.` );
              process.exit( 1 );
            }
          ' "${version}"

      - run: npm ci

      # A tag that disagrees with package.json publishes a version nobody asked for, under a
      # tag that then points at the wrong tree. Cheaper to stop here.
      - name: Tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./packages/gutenberg/package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${declared}. Bump the version, commit, then tag."
            exit 1
          fi
          echo "Publishing ${declared}."

      - run: npm test

      # build + publint --strict + attw + the tarball smoke test. The last one is what proves
      # the per-module subpaths resolve, which attw skips.
      - name: Packaging gate
        run: npm run verify:package --workspace=packages/gutenberg

      - name: Publish
        run: npm publish --provenance --workspace=packages/gutenberg
